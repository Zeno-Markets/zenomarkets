name: build

# Build only: the apps, services and contracts must compile on every branch. Tests and deploys run elsewhere.
on:
  push:
    branches: [main, testnet, mainnet]
  pull_request:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NEXT_PUBLIC_CHAIN_ID: "46630"
          NEXT_PUBLIC_RPC_URL: https://rpc.testnet.chain.robinhood.com
          NEXT_PUBLIC_EXPLORER_URL: https://explorer.testnet.chain.robinhood.com

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build --sizes
